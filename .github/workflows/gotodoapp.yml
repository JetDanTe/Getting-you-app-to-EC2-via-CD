name: CI/CD Pipeline

on:
  push:
    branches: [ master, dev, hw ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_NAME: go-to-do-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ${{ env.ECR_REPOSITORY_NAME }}
      run: |
        docker build -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG .
        
        if [[ ${{ github.ref }} == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          docker tag $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$REPOSITORY:$VERSION
          docker tag $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$REPOSITORY:latest
          echo "Pushing version tag: $VERSION"
          docker push $ECR_REGISTRY/$REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$REPOSITORY:latest
        elif [[ ${{ github.ref }} == refs/heads/master ]]; then
          docker tag $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$REPOSITORY:master
          docker tag $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$REPOSITORY:latest
          echo "Pushing master and latest tags"
          docker push $ECR_REGISTRY/$REPOSITORY:master
          docker push $ECR_REGISTRY/$REPOSITORY:latest
        elif [[ ${{ github.ref }} == refs/heads/dev ]]; then
          docker tag $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$REPOSITORY:dev
          echo "Pushing dev tag"
          docker push $ECR_REGISTRY/$REPOSITORY:dev
        fi
        
        echo "Pushing SHA tag: $IMAGE_TAG"
        docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG

      continue-on-error: false

    - name: Print image URI
      run: |
        echo "Image URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}"

