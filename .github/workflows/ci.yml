name: CI Pipeline

on:
  push:
    branches: [ master, dev, hw ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_BASE: go-to-do-app
  COMMIT_HASH: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up dynamic tags
      id: set-tags
      run: |
        # Set up base variables
        ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
        FRONTEND_REPO="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY_BASE }}-front"
        BACKEND_REPO="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY_BASE }}-back"
        
        # Always tag with commit hash
        echo "COMMIT_TAG=${{ env.COMMIT_HASH }}" >> $GITHUB_ENV
        
        # Determine additional tags based on git ref
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          # For version tags like v1.2.3
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION_TAG=${VERSION}" >> $GITHUB_ENV
          echo "ADDITIONAL_TAGS=${VERSION}" >> $GITHUB_ENV
        elif [[ $GITHUB_REF == refs/heads/master ]]; then
          # For master branch, add latest and master tags
          echo "ADDITIONAL_TAGS=latest master" >> $GITHUB_ENV
        elif [[ $GITHUB_REF == refs/heads/dev ]]; then
          # For dev branch
          echo "ADDITIONAL_TAGS=dev" >> $GITHUB_ENV
        else
          # For other branches, just use commit hash
          echo "ADDITIONAL_TAGS=" >> $GITHUB_ENV
        fi
        
        # Export repository URLs for later use
        echo "FRONTEND_REPO=${FRONTEND_REPO}" >> $GITHUB_ENV
        echo "BACKEND_REPO=${BACKEND_REPO}" >> $GITHUB_ENV

    - name: Build and tag Frontend
      run: |
        # Build frontend image with commit hash tag
        docker build -t ${{ env.FRONTEND_REPO }}:${{ env.COMMIT_TAG }} ./src/client
        
        # Add additional tags if any
        for tag in ${{ env.ADDITIONAL_TAGS }}; do
          echo "Tagging frontend with: $tag"
          docker tag ${{ env.FRONTEND_REPO }}:${{ env.COMMIT_TAG }} ${{ env.FRONTEND_REPO }}:$tag
        done

    - name: Build and tag Backend
      run: |
        # Build backend image with commit hash tag
        docker build -t ${{ env.BACKEND_REPO }}:${{ env.COMMIT_TAG }} ./src/go-server
        
        # Add additional tags if any
        for tag in ${{ env.ADDITIONAL_TAGS }}; do
          echo "Tagging backend with: $tag"
          docker tag ${{ env.BACKEND_REPO }}:${{ env.COMMIT_TAG }} ${{ env.BACKEND_REPO }}:$tag
        done

    - name: Push Frontend images
      run: |
        # Push commit hash tag
        docker push ${{ env.FRONTEND_REPO }}:${{ env.COMMIT_TAG }}
        
        # Push additional tags if any
        for tag in ${{ env.ADDITIONAL_TAGS }}; do
          echo "Pushing frontend tag: $tag"
          docker push ${{ env.FRONTEND_REPO }}:$tag
        done

    - name: Push Backend images
      run: |
        # Push commit hash tag
        docker push ${{ env.BACKEND_REPO }}:${{ env.COMMIT_TAG }}
        
        # Push additional tags if any
        for tag in ${{ env.ADDITIONAL_TAGS }}; do
          echo "Pushing backend tag: $tag"
          docker push ${{ env.BACKEND_REPO }}:$tag
        done

    - name: Print image URIs
      run: |
        echo "Frontend Image URIs:"
        echo "  - Commit hash: ${{ env.FRONTEND_REPO }}:${{ env.COMMIT_TAG }}"
        for tag in ${{ env.ADDITIONAL_TAGS }}; do
          echo "  - $tag: ${{ env.FRONTEND_REPO }}:$tag"
        done
        
        echo "Backend Image URIs:"
        echo "  - Commit hash: ${{ env.BACKEND_REPO }}:${{ env.COMMIT_TAG }}"
        for tag in ${{ env.ADDITIONAL_TAGS }}; do
          echo "  - $tag: ${{ env.BACKEND_REPO }}:$tag"
        done