services:
  frontend:
    build:
      context: ./src/client/
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./src/go-server/
      dockerfile: Dockerfile     
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/todoshka
    depends_on:
      - mongo

  mongo:
    image: mongo:5
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: --bind_ip_all

volumes:
  mongo_data:

